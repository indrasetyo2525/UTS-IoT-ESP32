; PlatformIO - UTS IoT ESP32-S3
; Jika memakai Arduino IDE, abaikan file ini dan salin isi src/main.cpp ke uts_iot/uts_iot.ino

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
